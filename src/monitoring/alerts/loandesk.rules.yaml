# Alert rules for LoanDesk, as code. Two groups:
#  - PromQL rules for Mimir/Prometheus, over the metrics the ForkLaunch HTTP
#    layer and the extraction worker export through OTLP;
#  - LogQL rules for the Loki ruler, over the named `event` fields the services
#    write in their JSON logs.
# Metric names are the OTLP names with dots replaced by underscores, as the
# collector's Prometheus exporter writes them; confirm the exact suffixes
# (`_total`, `_milliseconds_bucket`) against your collector before loading.
# Routing to a person (Alertmanager receiver / on-call rotation) is configured
# where these are loaded, not here.
groups:
  # Error-budget burn for the availability objective in docs/slo.md:
  # 99.5% of API requests are not 5xx over 30 days (budget: 0.5%).
  # Multi-window, multi-burn-rate: both windows must be over the rate, so an
  # alert fires quickly on a real burn and clears quickly when it stops.
  - name: loandesk-slo-burn
    rules:
      - record: loandesk:api_error_ratio:rate5m
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_count_total{service_name="api"}[5m]))
      - record: loandesk:api_error_ratio:rate30m
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[30m]))
            / sum(rate(http_server_request_count_total{service_name="api"}[30m]))
      - record: loandesk:api_error_ratio:rate1h
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[1h]))
            / sum(rate(http_server_request_count_total{service_name="api"}[1h]))
      - record: loandesk:api_error_ratio:rate6h
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[6h]))
            / sum(rate(http_server_request_count_total{service_name="api"}[6h]))
      - record: loandesk:api_error_ratio:rate3d
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[3d]))
            / sum(rate(http_server_request_count_total{service_name="api"}[3d]))
      - alert: LoanDeskErrorBudgetFastBurn
        expr: loandesk:api_error_ratio:rate1h > (14.4 * 0.005) and loandesk:api_error_ratio:rate5m > (14.4 * 0.005)
        for: 2m
        labels: { severity: page, slo: api-availability }
        annotations:
          summary: The API is spending its monthly error budget 14 times too fast (2% of it per hour)
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskErrorBudgetSlowBurn
        expr: loandesk:api_error_ratio:rate6h > (6 * 0.005) and loandesk:api_error_ratio:rate30m > (6 * 0.005)
        for: 15m
        labels: { severity: page, slo: api-availability }
        annotations:
          summary: The API is spending its monthly error budget 6 times too fast (5% of it in six hours)
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskErrorBudgetTrend
        expr: loandesk:api_error_ratio:rate3d > 0.005 and loandesk:api_error_ratio:rate6h > 0.005
        for: 1h
        labels: { severity: ticket, slo: api-availability }
        annotations:
          summary: At this error rate the API will miss its 99.5% availability objective this month
          runbook: docs/runbooks/failures.md#api-errors

  - name: loandesk-availability
    rules:
      - alert: LoanDeskHighErrorRate
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_count_total{service_name="api"}[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: More than 2% of API requests are failing
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{service_name="api"}[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: API p95 latency is above 1 second
          runbook: docs/runbooks/failures.md#slow-requests
      - alert: LoanDeskApiDown
        expr: absent(http_server_request_count_total{service_name="api"})
        for: 5m
        labels: { severity: page }
        annotations:
          summary: The API has reported no requests (health probes included) for 5 minutes
          runbook: docs/runbooks/failures.md#api-down

  - name: loandesk-extraction
    rules:
      - alert: LoanDeskDeadLetters
        expr: max(loandesk_extraction_queue_dead_letters) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: Extraction jobs have exhausted their retries
          runbook: docs/runbooks/failures.md#dead-letters
      - alert: LoanDeskQueueBacklog
        expr: max(loandesk_extraction_queue_depth{state="waiting"}) > 25
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Documents are waiting more than 10 minutes to be read
          runbook: docs/runbooks/failures.md#queue-backlog
      - alert: LoanDeskJobFailures
        expr: |
          sum(rate(loandesk_extraction_jobs_total{outcome=~"retried|dead_lettered"}[15m]))
            / sum(rate(loandesk_extraction_jobs_total[15m])) > 0.2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: More than 20% of extraction attempts are failing

  - name: loandesk-security-events   # Loki ruler (LogQL)
    rules:
      - alert: LoanDeskFailedSignInBurst
        expr: sum(count_over_time({service_name="api"} | json | event="login_failed" [5m])) > 20
        labels: { severity: page }
        annotations:
          summary: More than 20 failed sign-ins in 5 minutes
          runbook: docs/runbooks/failures.md#failed-sign-ins
      - alert: LoanDeskPermissionDenialBurst
        expr: sum(count_over_time({service_name="api"} | json | event="permission_denied" [5m])) > 30
        labels: { severity: ticket }
        annotations:
          summary: Unusual number of refused actions; someone may be probing for access
      - alert: LoanDeskCrossTenantStorageKey
        expr: sum(count_over_time({service_name="api"} | json | event="cross_tenant_storage_key" [5m])) > 0
        labels: { severity: page }
        annotations:
          summary: A storage key outside the tenant prefix was requested

  - name: loandesk-browser-errors   # Loki ruler (LogQL)
    rules:
      - alert: LoanDeskBrowserErrors
        expr: sum(count_over_time({service_name="api"} | json | event="browser_error" [10m])) > 10
        labels: { severity: ticket }
        annotations:
          summary: Users' browsers are reporting errors; a screen is probably broken
          runbook: docs/runbooks/failures.md#browser-errors
