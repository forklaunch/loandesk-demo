# Alert rules for LoanDesk, as code. Two groups:
#  - PromQL rules for Mimir/Prometheus, over the metrics the ForkLaunch HTTP
#    layer and the extraction worker export through OTLP;
#  - LogQL rules for the Loki ruler, over the named `event` fields the services
#    write in their JSON logs.
# Metric names are the OTLP names with dots replaced by underscores, as the
# collector's Prometheus exporter writes them; confirm the exact suffixes
# (`_total`, `_milliseconds_bucket`) against your collector before loading.
# Every alert carries `severity: page` or `severity: ticket`. Routing by that
# label is in alertmanager.yaml beside this file; who is behind each receiver
# (the on-call service, the team channel) is set there by the operating team.
groups:
  # Error-budget burn for the availability objective in docs/slo.md:
  # 99.5% of API requests are not 5xx over 30 days (budget: 0.5%).
  # Multi-window, multi-burn-rate: both windows must be over the rate, so an
  # alert fires quickly on a real burn and clears quickly when it stops.
  - name: loandesk-slo-burn
    rules:
      - record: loandesk:api_error_ratio:rate5m
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_count_total{service_name="api"}[5m]))
      - record: loandesk:api_error_ratio:rate30m
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[30m]))
            / sum(rate(http_server_request_count_total{service_name="api"}[30m]))
      - record: loandesk:api_error_ratio:rate1h
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[1h]))
            / sum(rate(http_server_request_count_total{service_name="api"}[1h]))
      - record: loandesk:api_error_ratio:rate6h
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[6h]))
            / sum(rate(http_server_request_count_total{service_name="api"}[6h]))
      - record: loandesk:api_error_ratio:rate3d
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[3d]))
            / sum(rate(http_server_request_count_total{service_name="api"}[3d]))
      - alert: LoanDeskErrorBudgetFastBurn
        expr: loandesk:api_error_ratio:rate1h > (14.4 * 0.005) and loandesk:api_error_ratio:rate5m > (14.4 * 0.005)
        for: 2m
        labels: { severity: page, slo: api-availability }
        annotations:
          summary: The API is spending its monthly error budget 14 times too fast (2% of it per hour)
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskErrorBudgetSlowBurn
        expr: loandesk:api_error_ratio:rate6h > (6 * 0.005) and loandesk:api_error_ratio:rate30m > (6 * 0.005)
        for: 15m
        labels: { severity: page, slo: api-availability }
        annotations:
          summary: The API is spending its monthly error budget 6 times too fast (5% of it in six hours)
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskErrorBudgetTrend
        expr: loandesk:api_error_ratio:rate3d > 0.005 and loandesk:api_error_ratio:rate6h > 0.005
        for: 1h
        labels: { severity: ticket, slo: api-availability }
        annotations:
          summary: At this error rate the API will miss its 99.5% availability objective this month
          runbook: docs/runbooks/failures.md#api-errors

  - name: loandesk-availability
    rules:
      - alert: LoanDeskHighErrorRate
        expr: |
          sum(rate(http_server_request_count_total{service_name="api",http_response_status_code=~"5.."}[5m]))
            / sum(rate(http_server_request_count_total{service_name="api"}[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: More than 2% of API requests are failing
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_bucket{service_name="api"}[5m]))) > 1
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: API p95 latency is above 1 second
          runbook: docs/runbooks/failures.md#slow-requests
      - alert: LoanDeskApiDown
        expr: absent(http_server_request_count_total{service_name="api"})
        for: 5m
        labels: { severity: page }
        annotations:
          summary: The API has reported no requests (health probes included) for 5 minutes
          runbook: docs/runbooks/failures.md#api-down

  - name: loandesk-extraction
    rules:
      - alert: LoanDeskDeadLetters
        expr: max(loandesk_extraction_queue_dead_letters) > 0
        for: 1m
        labels: { severity: ticket }
        annotations:
          summary: Extraction jobs have exhausted their retries
          runbook: docs/runbooks/failures.md#dead-letters
      - alert: LoanDeskQueueBacklog
        expr: max(loandesk_extraction_queue_depth{state="waiting"}) > 25
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: Documents are waiting more than 10 minutes to be read
          runbook: docs/runbooks/failures.md#queue-backlog
      - alert: LoanDeskJobFailures
        expr: |
          sum(rate(loandesk_extraction_jobs_total{outcome=~"retried|dead_lettered"}[15m]))
            / sum(rate(loandesk_extraction_jobs_total[15m])) > 0.2
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: More than 20% of extraction attempts are failing
          runbook: docs/runbooks/failures.md#dead-letters

  - name: loandesk-security-events   # Loki ruler (LogQL)
    rules:
      - alert: LoanDeskFailedSignInBurst
        expr: sum(count_over_time({service_name="api"} | json | event="login_failed" [5m])) > 20
        labels: { severity: page }
        annotations:
          summary: More than 20 failed sign-ins in 5 minutes
          runbook: docs/runbooks/security-events.md#failed-sign-ins
      - alert: LoanDeskPermissionDenialBurst
        expr: sum(count_over_time({service_name="api"} | json | event="permission_denied" [5m])) > 30
        labels: { severity: ticket }
        annotations:
          summary: Unusual number of refused actions; someone may be probing for access
          runbook: docs/runbooks/security-events.md#permission-denials
      - alert: LoanDeskCrossTenantStorageKey
        expr: sum(count_over_time({service_name=~"api|extraction"} | json | event="cross_tenant_storage_key" [5m])) > 0
        labels: { severity: page }
        annotations:
          summary: A storage key outside the tenant prefix was requested
          runbook: docs/runbooks/security-events.md#cross-tenant-storage-key
      - alert: LoanDeskAccountLockouts
        expr: sum(count_over_time({service_name="api"} | json | event="login_rate_limited" [10m])) > 5
        labels: { severity: ticket }
        annotations:
          summary: Sign-ins are being refused for locked accounts (five wrong passwords each); possible password guessing
          runbook: docs/runbooks/security-events.md#failed-sign-ins
      - alert: LoanDeskRateLimited
        expr: sum(count_over_time({service_name="api"} | json | event="rate_limited" [5m])) > 50
        labels: { severity: ticket }
        annotations:
          summary: Requests are being refused by the rate limits; a client is hammering the API
          runbook: docs/runbooks/security-events.md#rate-limits
      - alert: LoanDeskInvalidSessions
        expr: sum(count_over_time({service_name="api"} | json | event="invalid_session" [5m])) > 50
        labels: { severity: ticket }
        annotations:
          summary: Many requests carry a session cookie that is unknown, expired or revoked; possible token guessing or replay
          runbook: docs/runbooks/security-events.md#invalid-sessions
      - alert: LoanDeskDisabledAccountSignIn
        expr: sum(count_over_time({service_name="api"} | json | event="login_refused_disabled" [10m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: Someone signed in with the correct password of a disabled account
          runbook: docs/runbooks/security-events.md#disabled-account
      - alert: LoanDeskPasswordChangeRefused
        expr: sum(count_over_time({service_name="api"} | json | event="password_change_refused" [10m])) > 5
        labels: { severity: ticket }
        annotations:
          summary: Repeated password changes with a wrong current password; a session may be in someone else's hands
          runbook: docs/runbooks/security-events.md#password-change
      - alert: LoanDeskSsnRevealBurst
        expr: sum(count_over_time({service_name="api"} | json | event="ssn_revealed" [10m])) > 30
        labels: { severity: page }
        annotations:
          summary: More than 30 full SSNs were revealed in 10 minutes; far above normal use
          runbook: docs/runbooks/security-events.md#bulk-access
      - alert: LoanDeskBulkExport
        expr: sum(count_over_time({service_name="api"} | json | event=~"application_exported|document_downloaded" [10m])) > 50
        labels: { severity: ticket }
        annotations:
          summary: Unusual number of application exports or document downloads
          runbook: docs/runbooks/security-events.md#bulk-access
      - alert: LoanDeskAccountChange
        expr: sum(count_over_time({service_name="api"} | json | event=~"user_created|user_role_changed|user_disabled|user_enabled" [5m])) > 0
        labels: { severity: ticket }
        annotations:
          summary: A user account was created, enabled, disabled or given another role; confirm it was intended
          runbook: docs/runbooks/security-events.md#account-changes
      - alert: LoanDeskDisclosureNotReturned
        expr: sum(count_over_time({service_name="api"} | json | event="disclosure_not_returned" [10m])) > 10
        labels: { severity: ticket }
        annotations:
          summary: Requests are decrypting personal fields and then failing before they answer
          runbook: docs/runbooks/failures.md#api-errors

  - name: loandesk-governance   # Loki ruler (LogQL); events from the worker's scheduled job
    rules:
      - alert: LoanDeskAccessReviewOverdue
        expr: sum(count_over_time({service_name="extraction"} | json | event="access_review_overdue" [2h])) > 0
        labels: { severity: ticket }
        annotations:
          summary: No access review has been recorded within the review interval
          runbook: docs/runbooks/access-review.md
      - alert: LoanDeskStaleAccountsDisabled
        expr: sum(count_over_time({service_name="extraction"} | json | event=~"stale_accounts_disabled|stale_accounts|stale_admin_kept" [2h])) > 0
        labels: { severity: ticket }
        annotations:
          summary: Accounts unused for the stale period were disabled (or flagged); check they are no longer needed
          runbook: docs/runbooks/access-review.md#stale-accounts
      - alert: LoanDeskEncryptionKeyRotationDue
        expr: sum(count_over_time({service_name="extraction"} | json | event="encryption_key_rotation_due" [2h])) > 0
        labels: { severity: ticket }
        annotations:
          summary: The active field-encryption key is older than its rotation period
          runbook: docs/runbooks/key-rotation.md
      - alert: LoanDeskScheduledJobFailing
        expr: sum(count_over_time({service_name="extraction"} | json | event="lifecycle_step_failed" [2h])) > 0
        labels: { severity: ticket }
        annotations:
          summary: A step of the retention and access housekeeping job failed
          runbook: docs/runbooks/failures.md#scheduled-job
      - alert: LoanDeskScheduledJobNotRunning
        expr: absent_over_time({service_name="extraction"} | json | event="lifecycle_pass" [3h])
        labels: { severity: ticket }
        annotations:
          summary: The retention and access housekeeping job has not completed a pass for 3 hours
          runbook: docs/runbooks/failures.md#scheduled-job

  - name: loandesk-errors   # Loki ruler (LogQL): error tracking over the structured logs
    rules:
      - alert: LoanDeskPanic
        expr: sum(count_over_time({service_name=~"api|extraction"} | json | event="panic" [5m])) > 0
        labels: { severity: page }
        annotations:
          summary: A service process panicked; the log line has the location and backtrace
          runbook: docs/runbooks/failures.md#api-errors
      - alert: LoanDeskDependencyErrors
        expr: sum(count_over_time({service_name="api"} | json | event="dependency_error" [5m])) > 10
        labels: { severity: page }
        annotations:
          summary: Calls to PostgreSQL or the object store are failing; each log line names the operation and code location
          runbook: docs/runbooks/failures.md#api-errors

  - name: loandesk-dependencies   # PromQL, over loandesk.dependency.* (src/api/infrastructure/dependency_metrics.rs)
    rules:
      - alert: LoanDeskSlowDependency
        expr: |
          histogram_quantile(0.95, sum by (le, dependency) (rate(loandesk_dependency_duration_ms_bucket[5m]))) > 1000
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: PostgreSQL or object-store calls are taking more than a second at the 95th percentile
          runbook: docs/runbooks/failures.md#slow-requests
      - alert: LoanDeskDependencyFailureRate
        expr: sum(rate(loandesk_dependency_errors_total[5m])) > 0.2
        for: 5m
        labels: { severity: page }
        annotations:
          summary: More than one dependency call in five seconds is failing
          runbook: docs/runbooks/failures.md#api-errors

  - name: loandesk-browser-errors   # Loki ruler (LogQL)
    rules:
      - alert: LoanDeskBrowserErrors
        expr: sum(count_over_time({service_name="api"} | json | event="browser_error" [10m])) > 10
        labels: { severity: ticket }
        annotations:
          summary: Users' browsers are reporting errors; a screen is probably broken
          runbook: docs/runbooks/failures.md#browser-errors
