[package]
name = "shared"
description = "LoanDesk domain logic shared by the API and the extraction worker: risk summary, figure parser, demo PDF writer"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
regex = "1"
# Only the error type, to describe driver errors safely for logs (no driver is enabled here).
sqlx = { version = "0.9", default-features = false }

[features]
# Test helpers for the services' own log tests (see logsafe::testing).
testing = []
