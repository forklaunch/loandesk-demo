# LoanDesk's own checks, beside the generated ForkLaunch workflow (ci.yml).
name: Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Front end (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      - run: npm ci
      - run: npm run build
      # Build tools included: a vulnerable bundler or dev server is still a risk
      # to whoever builds the app.
      - name: Known vulnerabilities in front-end dependencies
        run: npm audit --audit-level=moderate

  workspace-dependencies:
    name: Generated TypeScript workspace dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
      # Both lockfiles of the generated ForkLaunch libraries (unused by the app,
      # but installed by anyone who works on them).
      - run: pnpm audit --audit-level=moderate
      - run: pnpm audit --audit-level=moderate
        working-directory: src

  dependencies:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked --version 0.22.2
      # Cargo.lock also lists crates that no LoanDesk binary contains (sqlx
      # locks its optional SQLite backend whether or not it is enabled). The
      # one advisory against such a crate is excepted in .cargo/audit.toml;
      # this step is what makes that exception safe, so it runs first. See
      # docs/controls.md, "Dependencies with known vulnerabilities".
      - name: Crates behind optional, disabled features are not in the build
        run: |
          if cargo tree --workspace --locked --target all -e all -i libsqlite3-sys 2>/dev/null | grep -q .; then
            echo "libsqlite3-sys is now compiled into a binary"; exit 1
          fi
      - run: cargo audit

  coverage:
    name: Rust test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.0 with coverage tools
        run: rustup toolchain install 1.98.0 --profile minimal --component llvm-tools-preview && rustup default 1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked --version 0.9.1
      # Line coverage of the unit and contract tests over the API, the worker
      # and the shared crate (generated SDKs and contract shims excluded).
      # They reach 28% of lines today; the floor is a little under that, so
      # coverage can only go down by a deliberate change to this number. The
      # number is low because it leaves out everything that needs PostgreSQL
      # and object storage (the services, the repository, the worker loop):
      # those run in the end-to-end job, whose coverage is not measured.
      - run: >
          cargo llvm-cov --workspace --locked --summary-only
          --ignore-filename-regex '(/sdk/|\.forklaunch/|__test__/)'
          --fail-under-lines 25

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The gitleaks binary, not gitleaks-action: the action needs a paid
      # licence for repositories owned by an organisation.
      - name: Scan every commit with gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner

  commit-messages:
    name: Commit message convention
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          for commit in $(git rev-list origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$commit" > /tmp/message
            sh scripts/check-commit-message.sh /tmp/message
          done

  end-to-end:
    name: End to end (real database, object store and worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Applies every migration to a fresh database, starts the whole stack
      # and waits for the health checks; fails if any service is unhealthy.
      - run: GIT_SHA=${{ github.sha }} docker compose up --build -d --wait
      - run: python3 scripts/e2e.py
      - name: Classified columns hold ciphertext, audit trail is append-only
        run: sh scripts/verify-storage.sh
      - name: Nothing personal in any log, readiness follows dependencies, shutdown is graceful
        run: sh scripts/verify-operations.sh
      - name: Main read paths hold the latency objective under load
        run: python3 scripts/load-test.py
      # Last: it rotates the stack's encryption key and restarts the services.
      - name: Retention purge, access review, password change, rate limits, key rotation
        run: python3 scripts/verify-lifecycle.py
      - if: failure()
        run: docker compose logs --no-color | tail -n 300
      - if: always()
        run: docker compose down -v
