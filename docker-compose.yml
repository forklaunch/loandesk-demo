# LoanDesk: run everything with `docker compose up --build`.
#
# The defaults below (database password, encryption key, demo password, demo
# seed data) are for local demos only. For anything else, copy .env.example to
# .env and set real values. Only the web UI is published, and only on localhost.

x-backend-env: &backend-env
  DB_HOST: db
  DB_NAME: loandesk
  DB_USER: loandesk
  DB_PASSWORD: ${POSTGRES_PASSWORD:-loandesk-local-dev}
  DOCS_DIR: /data/docs
  RUST_LOG: info

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loandesk
      POSTGRES_USER: loandesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loandesk-local-dev}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loandesk -d loandesk"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    image: loandesk-backend
    command: ["loandesk-api"]
    environment:
      <<: *backend-env
      APP_ENV: ${APP_ENV:-development}
      # 32 random bytes, base64. Encrypts owner SSNs. The default is a
      # well-known development key; the API refuses it when APP_ENV=production.
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-ZGV2LW9ubHkta2V5LWRvLW5vdC11c2UtaW4tcHJvZCE=}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-loandesk-demo-2026}
      # Set to true when served over HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - docs:/data/docs
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    image: loandesk-backend
    command: ["loandesk-worker"]
    environment:
      <<: *backend-env
    volumes:
      - docs:/data/docs
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-41080}:8080"
    depends_on:
      - api

volumes:
  dbdata:
  docs:
