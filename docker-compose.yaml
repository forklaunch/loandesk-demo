volumes:
  minio-data:
    driver: local
  mimir-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  loandesk-postgresql-data:
    driver: local
networks:
  loandesk-network:
    name: loandesk-network
    driver: bridge
services:
  minio:
    container_name: loandesk-minio
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    networks:
    - loandesk-network
    volumes:
    - minio-data:/data
    command: server /data --console-address :9001
    healthcheck:
      test:
      - CMD
      - mc
      - ready
      - local
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  minio-init:
    image: cgr.dev/chainguard/minio@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
    environment: {}
    depends_on:
      minio:
        condition: service_healthy
    networks:
    - loandesk-network
    entrypoint: /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb --ignore-existing local/forklaunch-telemetry && mc mb --ignore-existing local/loandesk-api-dev"
  tempo:
    image: grafana/tempo:3.0.0
    environment: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:3200:3200
    networks:
    - loandesk-network
    volumes:
    - ./src/monitoring/tempo.yaml:/etc/tempo.yaml
    - tempo-data:/var/tempo
    command: -target=all -config.file=/etc/tempo.yaml
    healthcheck:
      test:
      - CMD
      - /tempo
      - -health
      - -health.url=http://localhost:3200/ready
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
  loki:
    image: grafana/loki:3.7.7
    environment: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:3100:3100
    networks:
    - loandesk-network
    volumes:
    - ./src/monitoring/loki.yaml:/etc/loki/local-config.yaml
    - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
  mimir:
    image: grafana/mimir:3.2.0
    environment: {}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      memcached:
        condition: service_started
    ports:
    - 127.0.0.1:9090:9090
    networks:
    - loandesk-network
    volumes:
    - ./src/monitoring/mimir.yaml:/etc/mimir/mimir.yaml
    - mimir-data:/data
    command: -config.file=/etc/mimir/mimir.yaml
  memcached:
    image: memcached:1.6-alpine
    environment: {}
    networks:
    - loandesk-network
    command: -m 64
  grafana:
    image: grafana/grafana:12.3.1
    environment: {}
    ports:
    - 127.0.0.1:3000:3000
    networks:
    - loandesk-network
    volumes:
    - ./src/monitoring/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
    - ./src/monitoring/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:3000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    environment: {}
    depends_on:
      mimir:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    ports:
    - 127.0.0.1:4317:4317
    - 127.0.0.1:4318:4318
    - 127.0.0.1:13133:13133
    networks:
    - loandesk-network
    volumes:
    - ./src/monitoring/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    command: --config=/etc/otel-collector-config.yaml
  api:
    hostname: api
    container_name: loandesk-api-rust
    image: loandesk-rust:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.rust
    environment:
      HOST: 0.0.0.0
      PROTOCOL: http
      VERSION: v1
      DOCS_PATH: /docs
      RUST_LOG: info
      PORT: '8000'
      MCP_ENABLED: 'true'
      PUBLIC_ORIGIN: http://localhost:8000
      DATABASE_URL: ${API_DATABASE_URL:?Configure a restricted service PostgreSQL role}
      TENANT_ID: ${API_TENANT_ID:?Configure a trusted tenant UUID}
      STORAGE_ENCRYPTION_NAMESPACE: ${API_STORAGE_ENCRYPTION_NAMESPACE:?Configure a stable service storage namespace}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:?Configure encryption key}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
      ENCRYPTION_LEGACY_KEY_HEX: ${ENCRYPTION_LEGACY_KEY_HEX:-disabled}
      DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT: ${DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT:-false}
      S3_URL: http://minio:9000
      S3_BUCKET: loandesk-api-dev
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configure a field encryption key}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      api-migrate:
        condition: service_completed_successfully
    ports:
    - 8000:8000
    networks:
    - loandesk-network
    working_dir: /app
    command:
    - /app/bin/api
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  postgresql:
    hostname: postgresql
    container_name: loandesk-postgresql
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgresql
      POSTGRES_PASSWORD: postgresql
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
    - 127.0.0.1:5432:5432
    networks:
    - loandesk-network
    volumes:
    - loandesk-postgresql-data:/var/lib/postgresql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgresql -h localhost
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  postgresql-provision:
    image: postgres:latest
    restart: no
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
    - loandesk-network
    entrypoint:
    - sh
    - -c
    command:
    - |
      set -eu
      psql -v ON_ERROR_STOP=1 -h postgresql -U postgresql -d postgres <<'SQL'
      SELECT format('CREATE ROLE %I LOGIN', name) FROM unnest(ARRAY['api_owner', 'api_app']) AS name WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = name)\gexec
      SELECT format('CREATE DATABASE %I OWNER %I', 'loandesk_api', 'api_owner') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'loandesk_api')\gexec
      SQL
      psql -v ON_ERROR_STOP=1 -h postgresql -U postgresql -d 'loandesk_api' <<'SQL'
      ALTER SCHEMA public OWNER TO api_owner;
      ALTER DEFAULT PRIVILEGES FOR ROLE api_owner GRANT USAGE ON SCHEMAS TO api_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE api_owner GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO api_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE api_owner GRANT USAGE, SELECT ON SEQUENCES TO api_app;
      SELECT format('GRANT USAGE ON SCHEMA %I TO %I', nspname, 'api_app') FROM pg_namespace WHERE nspowner = 'api_owner'::regrole\gexec
      SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', nspname, 'api_app') FROM pg_namespace WHERE nspowner = 'api_owner'::regrole\gexec
      SELECT format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', nspname, 'api_app') FROM pg_namespace WHERE nspowner = 'api_owner'::regrole\gexec
      SQL
      psql -v ON_ERROR_STOP=1 -h postgresql -U postgresql -d postgres <<'SQL'
      SELECT format('CREATE ROLE %I LOGIN', name) FROM unnest(ARRAY['extraction_owner', 'extraction_app']) AS name WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = name)\gexec
      SELECT format('CREATE DATABASE %I OWNER %I', 'loandesk_extraction', 'extraction_owner') WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'loandesk_extraction')\gexec
      SQL
      psql -v ON_ERROR_STOP=1 -h postgresql -U postgresql -d 'loandesk_extraction' <<'SQL'
      ALTER SCHEMA public OWNER TO extraction_owner;
      ALTER DEFAULT PRIVILEGES FOR ROLE extraction_owner GRANT USAGE ON SCHEMAS TO extraction_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE extraction_owner GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO extraction_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE extraction_owner GRANT USAGE, SELECT ON SEQUENCES TO extraction_app;
      SELECT format('GRANT USAGE ON SCHEMA %I TO %I', nspname, 'extraction_app') FROM pg_namespace WHERE nspowner = 'extraction_owner'::regrole\gexec
      SELECT format('GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA %I TO %I', nspname, 'extraction_app') FROM pg_namespace WHERE nspowner = 'extraction_owner'::regrole\gexec
      SELECT format('GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA %I TO %I', nspname, 'extraction_app') FROM pg_namespace WHERE nspowner = 'extraction_owner'::regrole\gexec
      SQL
  api-migrate:
    image: loandesk-rust:local
    restart: no
    build:
      context: .
      dockerfile: Dockerfile.rust
    environment:
      HOST: 0.0.0.0
      PROTOCOL: http
      VERSION: v1
      DOCS_PATH: /docs
      RUST_LOG: info
      PORT: '8000'
      MCP_ENABLED: 'true'
      PUBLIC_ORIGIN: http://localhost:8000
      DATABASE_URL: ${API_MIGRATION_DATABASE_URL:?Configure the migration owner role}
      TENANT_ID: ${API_TENANT_ID:?Configure a trusted tenant UUID}
      STORAGE_ENCRYPTION_NAMESPACE: ${API_STORAGE_ENCRYPTION_NAMESPACE:?Configure a stable service storage namespace}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:?Configure encryption key}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
      ENCRYPTION_LEGACY_KEY_HEX: ${ENCRYPTION_LEGACY_KEY_HEX:-disabled}
      DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT: ${DATABASE_ALLOW_PLAINTEXT_DEVELOPMENT:-false}
      S3_URL: http://minio:9000
      S3_BUCKET: loandesk-api-dev
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Configure a field encryption key}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MIGRATION_DATABASE_URL: ${API_MIGRATION_DATABASE_URL:?Configure the migration owner role}
    depends_on:
      postgresql-provision:
        condition: service_completed_successfully
    networks:
    - loandesk-network
    working_dir: /app
    command:
    - /app/bin/api
    - --migrate
  extraction:
    hostname: extraction
    container_name: loandesk-extraction-rust
    image: loandesk-rust:local
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PROTOCOL: http
      VERSION: v1
      DOCS_PATH: /docs
      RUST_LOG: info
      QUEUE_NAME: loandesk-extraction-dev
      DATABASE_URL: ${EXTRACTION_DATABASE_URL:?Configure a restricted PostgreSQL role}
      TENANT_ID: ${EXTRACTION_TENANT_ID:?Configure a trusted tenant UUID}
      WORKER_QUEUE: extraction
      WORKER_MAX_ATTEMPTS: '3'
      WORKER_BACKOFF_SECONDS: '30'
      WORKER_CONCURRENCY: '1'
      WORKER_BATCH_SIZE: '1'
      WORKER_POLL_MS: '250'
      WORKER_LEASE_MS: '30000'
      WORKER_RENEW_MS: '10000'
      WORKER_DRAIN_MS: '30000'
      WORKER_ALLOW_PLAINTEXT_DEVELOPMENT: ${WORKER_ALLOW_PLAINTEXT_DEVELOPMENT:-false}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:?Configure a 32-byte worker encryption key}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
      ENCRYPTION_LEGACY_KEY_HEX: ${ENCRYPTION_LEGACY_KEY_HEX:-disabled}
    depends_on:
      extraction-migrate:
        condition: service_completed_successfully
    networks:
    - loandesk-network
    working_dir: /app
    command:
    - /app/bin/extraction
  extraction-migrate:
    image: loandesk-rust:local
    restart: no
    environment:
      HOST: 0.0.0.0
      PROTOCOL: http
      VERSION: v1
      DOCS_PATH: /docs
      RUST_LOG: info
      QUEUE_NAME: loandesk-extraction-dev
      DATABASE_URL: ${EXTRACTION_MIGRATION_DATABASE_URL:?Configure the migration owner role}
      TENANT_ID: ${EXTRACTION_TENANT_ID:?Configure a trusted tenant UUID}
      WORKER_QUEUE: extraction
      WORKER_MAX_ATTEMPTS: '3'
      WORKER_BACKOFF_SECONDS: '30'
      WORKER_CONCURRENCY: '1'
      WORKER_BATCH_SIZE: '1'
      WORKER_POLL_MS: '250'
      WORKER_LEASE_MS: '30000'
      WORKER_RENEW_MS: '10000'
      WORKER_DRAIN_MS: '30000'
      WORKER_ALLOW_PLAINTEXT_DEVELOPMENT: ${WORKER_ALLOW_PLAINTEXT_DEVELOPMENT:-false}
      ENCRYPTION_KEY_HEX: ${ENCRYPTION_KEY_HEX:?Configure a 32-byte worker encryption key}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-primary}
      ENCRYPTION_PREVIOUS_KEYS_JSON: ${ENCRYPTION_PREVIOUS_KEYS_JSON:-}
      ENCRYPTION_LEGACY_KEY_HEX: ${ENCRYPTION_LEGACY_KEY_HEX:-disabled}
      MIGRATION_DATABASE_URL: ${EXTRACTION_MIGRATION_DATABASE_URL:?Configure the migration owner role}
    depends_on:
      postgresql-provision:
        condition: service_completed_successfully
    networks:
    - loandesk-network
    working_dir: /app
    command:
    - /app/bin/extraction
    - --migrate
