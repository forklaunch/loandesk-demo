server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Slightly above the 20 MB document limit, which object storage itself enforces.
    client_max_body_size 21m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Docker's resolver, so a restarted backend container is found again.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        client_max_body_size 1m;
    }

    # Document uploads and downloads go straight to object storage with a
    # short-lived signed grant from the API. The Host header must be the one
    # the grant was signed for.
    location /storage/ {
        set $store http://object-store:9000;
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass $store;
        proxy_set_header Host object-store:9000;
        proxy_request_buffering off;
        proxy_buffering off;
        limit_except GET POST { deny all; }
    }

    location / {
        try_files $uri /index.html;
    }
}
