language = "mixed"
applicationLanguage = "mixed"
sdkTargets = [
    "typescript",
    "rust",
]
cargoWorkspace = "Cargo.toml"
id = "0093d580-7643-41ea-9f6c-69130d1fc375"
cli_version = "1.33.0"
app_name = "loandesk"
modules_path = "src"
app_description = "LoanDesk: commercial loan intake for a lending team"
linter = "oxlint"
formatter = "prettier"
validator = "zod"
http_framework = "express"
runtime = "node"
test_framework = "vitest"
author = "LoanDesk"
license = "none"
platform_application_id = "050fe684-456d-49e3-abc5-c7bb73701ff9"
platform_organization_id = "0dc69b58-4d61-4845-9f76-19710c36a8f9"

[[projects]]
type = "Library"
name = "core"
description = "Core library for loandesk, containing shared foundational infrastrucuture and utilities"

[[projects]]
type = "Library"
name = "monitoring"
description = "Monitoring library for loandesk, defining metrics, logs, and trace building blocks"

[[projects]]
type = "Library"
name = "client-sdk"
description = "Client SDK for loandesk, containing shared foundational infrastrucuture and utilities"

[[projects]]
type = "Service"
name = "loans-service"
description = "LoanDesk REST API: applications, documents, decisions and user management"
routers = [
    "auth",
    "applications",
    "documents",
    "users",
]

[projects.resources]
database = "postgresql"
object_store = "s3"

[projects.metadata]
sdkLayout = "project-local-v1"
language = "rust"
crateName = "api"
cratePath = "src/api"
contractArtifactPath = "src/api/sdk/typescript/contract.json"
openapiPath = "src/api/sdk/typescript/openapi.json"
asyncapiPath = "src/api/sdk/typescript/asyncapi.json"
sdkTargets = [
    "typescript",
    "rust",
]
persistence = "postgresql"

[[projects]]
type = "Worker"
name = "loans"
description = "Extracts key figures from uploaded loan documents"
variant = "worker-postgres"
routers = []

[projects.resources]
database = "postgresql"

[projects.metadata]
contractExport = false
language = "rust"
crateName = "extraction"
cratePath = "src/extraction"
sdkTargets = [
    "typescript",
    "rust",
]
workerType = "database"
workerRuntime = "leased"
workerService = false
workerControlService = true

[project_peer_topology]
loandesk = [
    "core",
    "monitoring",
    "client-sdk",
]

[framework]
version = "0.2.5"
blueprint_version = "0.2.5"
